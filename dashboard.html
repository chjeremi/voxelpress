<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pemilik Mesin - VoxelPress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0e1a;--bg-2:#0d1220;--ink:#ffffff;--ink-2:rgba(255,255,255,.7);--ink-3:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.1);--line-2:rgba(255,255,255,.06);
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  --glass-border:rgba(255,255,255,.1);--glass-blur:blur(40px);
  --indigo:#6366f1;--indigo-soft:#a5b4fc;--pink:#ec4899;--cyan:#22d3ee;--green:#4ade80;--amber:#fbbf24;
  --grad-b:linear-gradient(135deg,#6366f1,#ec4899);
  --font-sans:'Space Grotesk',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --r-lg:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 85% 20%,rgba(99,102,241,.22) 0%,transparent 50%),radial-gradient(circle at 15% 80%,rgba(236,72,153,.15) 0%,transparent 50%);z-index:0;pointer-events:none;}

.header{position:fixed;top:0;left:0;right:0;height:80px;display:flex;align-items:center;justify-content: space-between;padding:0 32px;z-index:100;background:rgba(10,14,26,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2);}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:16px;text-decoration:none;color:#fff}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--grad-b);}

.main-wrapper{min-height:100vh;padding:110px 6vmin 50px;position:relative;z-index:1;max-width:1200px;margin:0 auto;}
.glass-card{background:var(--glass-bg);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:28px;box-shadow:0 30px 60px rgba(0,0,0,.4);}

.status-badge{font-family:var(--font-mono);font-size:11px;padding:4px 10px;border-radius:100px;display:inline-block;}
.status-pending{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);}
.status-printing{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}
.status-completed{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.3);}

.order-table{width:100%;border-collapse:collapse;margin-top:20px;font-family:var(--font-body);font-size:14px;}
.order-table th,.order-table td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line-2);}
.order-table th{color:var(--ink-3);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;}

.action-btn{padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--glass-border);cursor:pointer;font-size:12px;transition:all .2s;}
.action-btn:hover{background:rgba(255,255,255,.18);}
</style>
</head>
<body>
  <header class="header">
    <a href="#" class="brand"><span class="logo"></span> VoxelPress Dashboard Operator</a>
    <div style="font-family:var(--font-mono);font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px;">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);"></span> Live Sync Active
    </div>
  </header>

  <main class="main-wrapper">
    <div class="glass-card">
      <div style="display:flex;justify-content: space-between;align-items:center;margin-bottom:20px;">
        <div>
          <h1 style="font-size:24px;font-weight:600;">Antrean Pesanan Masuk</h1>
          <p style="font-family:var(--font-body);font-size:13px;color:var(--ink-2);">Data diperbarui secara otomatis tanpa refresh.</p>
        </div>
      </div>

      <table class="order-table">
        <thead>
          <tr>
            <th>Waktu</th>
            <th>Pemesan</th>
            <th>File Model</th>
            <th>Material</th>
            <th>Qty</th>
            <th>Total Harga</th>
            <th>Status</th>
            <th>Aksi Operator</th>
          </tr>
        </thead>
        <tbody id="orderTableBody">
          <tr><td colspan="8" style="text-align:center;color:var(--ink-3);">Memuat data pesanan...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
  const SUPABASE_URL = 'https://ovcqszjabltbheertlyp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Y3FzemphYmx0YmhlZXJ0bHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjU2MzQsImV4cCI6MjEwMjU0MTYzNH0.kzelNFMboz_EyrWfzUmrygwcI5L5SdwYZ-H7-iD4n20';

  // Ubah nama variabel agar tidak bentrok dengan library global
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let ordersCache = [];

  async function fetchOrders() {
    const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
    if (error) {
      console.error('Error fetching orders:', error);
      return;
    }
    ordersCache = data;
    renderOrders();
  }

  function renderOrders() {
    const tbody = document.getElementById('orderTableBody');
    if (ordersCache.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--ink-3);">Belum ada pesanan masuk.</td></tr>';
      return;
    }

    tbody.innerHTML = ordersCache.map(order => {
      let statusClass = 'status-pending';
      if (order.status === 'Printing') statusClass = 'status-printing';
      if (order.status === 'Completed') statusClass = 'status-completed';

      const dateStr = new Date(order.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

      return `
        <tr>
          <td style="font-family:var(--font-mono);">${dateStr}</td>
          <td style="font-weight:600;">${order.customer_name || 'Anonim'}</td>
          <td style="font-family:var(--font-mono);color:var(--indigo-soft);">${order.file_name}</td>
          <td>${order.material}</td>
          <td>${order.quantity} pcs</td>
          <td style="font-family:var(--font-mono);color:var(--green);">Rp ${order.total_price.toLocaleString('id-ID')}</td>
          <td><span class="status-badge ${statusClass}">${order.status}</span></td>
          <td>
            ${order.status === 'Pending' ? `<button class="action-btn" onclick="updateOrderStatus('${order.id}', 'Printing')">Mulai Cetak</button>` : ''}
            ${order.status === 'Printing' ? `<button class="action-btn" style="border-color:var(--green);" onclick="updateOrderStatus('${order.id}', 'Completed')">Selesaikan</button>` : ''}
            ${order.status === 'Completed' ? `<span style="color:var(--ink-3);font-size:12px;">Selesai</span>` : ''}
          </td>
        </tr>
      `;
    }).join('');
  }

  async function updateOrderStatus(id, newStatus) {
    const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', id);
    if (error) alert('Gagal update status: ' + error.message);
  }

  // Subscribe ke Listener Real-Time Supabase
  supabaseClient
    .channel('public:orders')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
      fetchOrders(); // Refresh data ketika ada baris baru/update status
    })
    .subscribe();

  // Fetch awal saat dimuat
  fetchOrders();
</script>
</body>
</html>
