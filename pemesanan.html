<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pemesanan Cetak 3D - VoxelPress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="app.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>
  <header class="header">
    <a href="index.html" class="brand"><span class="logo"></span> VoxelPress</a>
    <a href="simulasi.html" class="back-btn">&larr; Kembali ke Simulasi</a>
  </header>

  <main class="main-wrapper">
    <div class="glass-card">
      <h2 style="font-size:24px;font-weight:600;margin-bottom:6px;">Konfirmasi & Pemesanan</h2>
      <p style="font-family:var(--font-body);font-size:13px;color:var(--ink-2);margin-bottom:24px;">Kirimkan spesifikasi hasil simulasi ke penyedia jasa cetak.</p>

      <form id="orderForm">
        <div class="form-group">
          <label>Nama Pemesan</label>
          <input type="text" id="customerName" class="form-control" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label>Material Terpilih (Tersimulasi)</label>
          <select id="materialSelect" class="form-control" onchange="updatePrice()">
            <option value="PLA">PLA (Rp 1.500 / gram)</option>
            <option value="PETG">PETG (Rp 2.000 / gram)</option>
            <option value="ABS">ABS (Rp 2.500 / gram)</option>
            <option value="TPU">TPU (Rp 3.500 / gram)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Jumlah Cetak (Qty)</label>
          <input type="number" id="orderQty" class="form-control" value="1" min="1" onchange="updatePrice()" required>
        </div>

        <div class="order-summary">
          <div class="order-row">
            <span style="color:var(--ink-3);">File Model:</span>
            <span id="summaryFileName" style="color:var(--cyan);">Memuat...</span>
          </div>
          <div class="order-row">
            <span style="color:var(--ink-3);">Estimasi Berat:</span>
            <span>45 Gram</span>
          </div>
          <hr style="border:none;border-top:1px solid var(--line-2);margin:10px 0;">
          <div class="order-row" style="font-size:16px;font-weight:700;">
            <span>Total Biaya:</span>
            <span id="totalPriceText" style="color:var(--green);">Rp 0</span>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btnSubmit">Kirim Pesanan Sekarang &rarr;</button>
      </form>
    </div>
  </main>

  <script>
  // --- 1. GUARD ACCESS & CHECK SIMULATION DATA ---
  const rawSimData = sessionStorage.getItem('voxelpress_sim_data');
  if (!rawSimData) {
    alert('Akses Ditolak! Anda harus menyelesaikan simulasi terlebih dahulu.');
    window.location.href = 'simulasi.html';
  }

  const simData = JSON.parse(rawSimData);
  if (!simData || !simData.accessGranted) {
    alert('Data simulasi tidak valid.');
    window.location.href = 'simulasi.html';
  }

  // --- 2. INITIALIZE SUPABASE (Gunakan supabaseClient agar tidak bentrok) ---
  const SUPABASE_URL = 'https://ovcqszjabltbheertlyp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Y3FzemphYmx0YmhlZXJ0bHlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjU2MzQsImV4cCI6MjEwMjU0MTYzNH0.kzelNFMboz_EyrWfzUmrygwcI5L5SdwYZ-H7-iD4n20';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const PRICE_MAP = { PLA: 1500, PETG: 2000, ABS: 2500, TPU: 3500 };
  const ESTIMATED_WEIGHT = 45; 

  // Inject data dari simulasi ke UI Pemesanan
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('summaryFileName').innerText = simData.fileName;
    document.getElementById('materialSelect').value = simData.material || 'PETG';
    updatePrice();
  });

  function updatePrice() {
    const mat = document.getElementById('materialSelect').value;
    const qty = parseInt(document.getElementById('orderQty').value) || 1;
    const total = PRICE_MAP[mat] * ESTIMATED_WEIGHT * qty;
    document.getElementById('totalPriceText').innerText = 'Rp ' + total.toLocaleString('id-ID');
    return total;
  }

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  btn.innerText = 'Mengirim Pesanan...';
  btn.disabled = true;

  const orderData = {
    customer_name: document.getElementById('customerName').value,
    file_name: document.getElementById('summaryFileName').innerText,
    material: document.getElementById('materialSelect').value,
    quantity: parseInt(document.getElementById('orderQty').value),
    total_price: updatePrice(),
    status: 'Pending'
  };

  // Kirim data ke Supabase
  const { data, error } = await supabaseClient
    .from('orders')
    .insert([orderData])
    .select(); // Tambahkan .select() agar Supabase mengembalikan ID data yang baru dibuat

  if (error) {
    alert('Gagal mengirim pesanan: ' + error.message);
    btn.innerText = 'Kirim Pesanan Sekarang \u2192';
    btn.disabled = false;
  } else {
    // Simpan hasil response pesanan ke sessionStorage untuk dibaca di status-pesanan.html
    sessionStorage.setItem('voxelpress_last_order', JSON.stringify(data[0]));
    sessionStorage.removeItem('voxelpress_sim_data');
    
    // Arahkan ke halaman status pesanan
    window.location.href = 'status-pesanan.html';
  }
});
</script>
</body>
</html>
